# ===============================
# SERVER CONFIGURATION
# ===============================
server.port=${SERVER_PORT:8080}

# ===============================
# POSTGRESQL DATABASE
# Values come from environment variables; the part after ":" is only a local default.
# Never commit real passwords - set DB_PASSWORD in your shell, IDE run config or .env file.
# ===============================
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/Employee_DB}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:your_password}
spring.datasource.driver-class-name=org.postgresql.Driver

# ===============================
# JPA / HIBERNATE
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ===============================
# JWT
# JWT_SECRET must be at least 32 characters. Use a long random value in real deployments.
# ===============================
jwt.secret=${JWT_SECRET:change-me-this-is-only-a-local-dev-secret-key-1234567890}
jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

# ===============================
# SWAGGER / OPENAPI
# ===============================
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# ===============================
# LOGGING
# ===============================
logging.level.org.hibernate.SQL=${SQL_LOG_LEVEL:INFO}
